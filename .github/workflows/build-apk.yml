name: Build Choco Mouse APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Скачивание кода репозитория
        uses: actions/checkout@v4

      - name: ☕ Установка Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 🟢 Установка Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 🛠️ Инициализация Capacitor и упаковка index.html
        run: |
          mkdir -p www
          cp index.html www/index.html

          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android

          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.choco.mousegame",
            "appName": "Мышка для Шоколада",
            "webDir": "www",
            "bundledWebRuntime": false
          }
          EOF

          npx cap add android
          npx cap sync android

      - name: 🐾 Настройка Android (Full Screen + Фикс дубликатов Kotlin)
        run: |
          # 1. Разрешаем вибрацию в AndroidManifest.xml
          sed -i 's/<application/<uses-permission android:name="android.permission.VIBRATE" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

          # 2. Исправляем конфликт версий kotlin-stdlib-jdk7/jdk8 в Gradle
          cat << 'EOF' >> android/app/build.gradle

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          # 3. Прописываем жесткий полноэкранный режим и запрет гашения экрана
          MAIN_ACT="android/app/src/main/java/com/choco/mousegame/Main
